<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library Fine Calculator</title>
    <style>
      :root {
        --bg-1: #0f172a;
        --bg-2: #111827;
        --panel: rgba(17, 24, 39, 0.8);
        --panel-soft: rgba(15, 23, 42, 0.6);
        --card: rgba(15, 23, 42, 0.9);
        --accent: #8b5cf6;
        --accent-2: #22d3ee;
        --text: #e5e7eb;
        --muted: #a5b4fc;
        --success: #34d399;
        --danger: #f87171;
        --border: rgba(148, 163, 184, 0.25);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(139, 92, 246, 0.45), transparent 28%),
          radial-gradient(circle at bottom right, rgba(34, 211, 238, 0.35), transparent 24%),
          linear-gradient(135deg, var(--bg-1), var(--bg-2));
        color: var(--text);
      }

      .app {
        width: min(92vw, 1000px);
        padding: 30px;
      }

      .card {
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.55);
        backdrop-filter: blur(10px);
        overflow: hidden;
      }

      .header {
        padding: 28px 30px 18px;
        background: linear-gradient(135deg, rgba(139, 92, 246, 0.18), rgba(34, 211, 238, 0.08));
        border-bottom: 1px solid var(--border);
      }

      .badge {
        display: inline-block;
        padding: 7px 12px;
        border-radius: 999px;
        background: rgba(139, 92, 246, 0.12);
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.12rem;
        text-transform: uppercase;
        border: 1px solid rgba(139, 92, 246, 0.35);
      }

      h1 {
        margin: 16px 0 0;
        font-size: clamp(2rem, 3vw, 3.2rem);
        letter-spacing: -0.06em;
      }

      .content {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: 28px;
        padding: 28px 30px 30px;
      }

      form {
        display: grid;
        gap: 20px;
        padding-left: 18px;
        padding-right: 18px;
      }

      .field {
        display: grid;
        gap: 9px;
      }

      label {
        font-size: 0.9rem;
        color: var(--muted);
        letter-spacing: 0.04rem;
      }

      select, input, button {
        font: inherit;
      }

      select, input {
        width: 100%;
        padding: 14px 18px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.8);
        color: var(--text);
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        appearance: none;
      }

      select:focus, input:focus {
        border-color: rgba(34, 211, 238, 0.9);
        box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.15);
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 16px 18px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: white;
        font-weight: 700;
        letter-spacing: 0.04rem;
        cursor: pointer;
        transition: transform 0.18s ease, box-shadow 0.18s ease;
        box-shadow: 0 12px 28px rgba(139, 92, 246, 0.35);
      }

      button:hover {
        transform: translateY(-1px);
      }

      .receipt {
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.92), rgba(17, 24, 39, 0.95));
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 20px 18px;
      }

      .receipt.hidden {
        display: none;
      }

      .receipt h2 {
        margin: 0 0 16px;
        font-size: 1.2rem;
      }

      .summary-grid {
        display: grid;
        gap: 12px;
      }

      .summary-item {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid rgba(148, 163, 184, 0.15);
      }

      .summary-item:last-child {
        border-bottom: none;
      }

      .summary-item span:first-child {
        color: var(--muted);
      }

      .summary-item strong {
        color: var(--text);
      }

      .fine {
        margin-top: 12px;
        padding-top: 14px;
        border-top: 1px solid rgba(148, 163, 184, 0.2);
        font-size: 1.4rem;
        font-weight: 800;
        color: var(--success);
      }

      .status {
        margin-top: 18px;
        padding: 12px 14px;
        border-radius: 10px;
        background: rgba(52, 211, 153, 0.12);
        color: var(--success);
        border: 1px solid rgba(52, 211, 153, 0.22);
      }

      .status.warning {
        background: rgba(248, 113, 113, 0.12);
        color: var(--danger);
        border-color: rgba(248, 113, 113, 0.25);
      }

      @media (max-width: 760px) {
        .content {
          grid-template-columns: 1fr;
        }

        .app {
          width: min(95vw, 700px);
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="card">
        <div class="header">
          <span class="badge">Library desk</span>
          <h1>Late Fee Calculator</h1>
        </div>

        <div class="content">
          <form id="libraryForm">
            <div class="field">
              <label for="bookType">Book type</label>
              <select id="bookType">
                <option value="standard">Standard</option>
                <option value="best-seller">Best-Seller</option>
                <option value="dvd">DVD</option>
              </select>
            </div>

            <div class="field">
              <label for="membership">Member type</label>
              <select id="membership">
                <option value="adult">Adult</option>
                <option value="student">Student</option>
                <option value="senior">Senior</option>
              </select>
            </div>

            <div class="field">
              <label for="dueDate">Due date</label>
              <input id="dueDate" type="text" value="01/11/26" placeholder="DD/MM/YY" />
            </div>

            <div class="field">
              <label for="returnDate">Return date</label>
              <input id="returnDate" type="text" placeholder="DD/MM/YY" />
            </div>

            <button type="submit">Calculate fine</button>
          </form>

          <div id="receipt" class="receipt hidden" aria-live="polite">
            <h2>Receipt Summary</h2>
            <div class="summary-grid">
              <div class="summary-item"><span>Book type</span><strong id="bookSummary">-</strong></div>
              <div class="summary-item"><span>Membership</span><strong id="memberSummary">-</strong></div>
              <div class="summary-item"><span>Due date</span><strong id="dueSummary">-</strong></div>
              <div class="summary-item"><span>Return date</span><strong id="returnSummary">-</strong></div>
              <div class="summary-item"><span>Days late</span><strong id="daysSummary">0</strong></div>
            </div>
            <div class="fine">Fine due: £<span id="fineSummary">0.00</span></div>
            <div id="statusBox" class="status">On time and all good.</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const BOOK_RATES = {
        standard: 0.5,
        'best-seller': 1,
        dvd: 2
      };

      function formatDate(date) {
        const day = String(date.getDate()).padStart(2, '0');
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const year = String(date.getFullYear()).slice(-2);
        return `${day}/${month}/${year}`;
      }

      function parseDate(value) {
        const [day, month, year] = String(value).split('/');
        return new Date(2000 + Number(year), Number(month) - 1, Number(day));
      }

      function calculateDaysLate(dueDate, currentDate) {
        const due = parseDate(dueDate);
        const current = parseDate(currentDate);
        const diffDays = Math.floor((current - due) / (1000 * 60 * 60 * 24));
        return diffDays < 0 ? 0 : diffDays;
      }

      function calculateFine(bookType, membership, daysLate) {
        const dailyFine = BOOK_RATES[bookType];
        let fine = daysLate * dailyFine;

        if (membership === 'senior') {
          fine *= 0.5;
        } else if (membership === 'student') {
          fine *= 0.8;
        }

        if (fine > 15) {
          fine = 15;
        }

        return Number(fine.toFixed(2));
      }

      const today = new Date();
      document.getElementById('returnDate').value = formatDate(today);

      document.getElementById('libraryForm').addEventListener('submit', function (event) {
        event.preventDefault();

        const bookType = document.getElementById('bookType').value;
        const membership = document.getElementById('membership').value;
        const dueDate = document.getElementById('dueDate').value;
        const returnDate = document.getElementById('returnDate').value;

        const daysLate = calculateDaysLate(dueDate, returnDate);
        const fine = calculateFine(bookType, membership, daysLate);

        document.getElementById('bookSummary').textContent = bookType.toUpperCase().replace('-', ' ');
        document.getElementById('memberSummary').textContent = membership.charAt(0).toUpperCase() + membership.slice(1);
        document.getElementById('dueSummary').textContent = dueDate;
        document.getElementById('returnSummary').textContent = returnDate;
        document.getElementById('daysSummary').textContent = daysLate;
        document.getElementById('fineSummary').textContent = fine.toFixed(2);

        const statusBox = document.getElementById('statusBox');
        if (daysLate === 0) {
          statusBox.textContent = 'Thank you! Your book was returned on time.';
          statusBox.classList.remove('warning');
          statusBox.classList.add('status');
        } else {
          statusBox.textContent = 'Please pay your outstanding fine.';
          statusBox.classList.remove('status');
          statusBox.classList.add('warning');
        }

        document.getElementById('receipt').classList.remove('hidden');
      });
    </script>
  </body>
</html>
